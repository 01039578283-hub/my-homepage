<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>전주혁신점 카카오맵</title><style>html,body{margin:0;padding:0;min-width:0;background:#fff}.root_daum_roughmap{width:100%!important;box-sizing:border-box}.root_daum_roughmap .wrap_map{width:100%!important}.root_daum_roughmap>.cont{display:none}.root_daum_roughmap .wrap_btn_roadview{display:none!important}.root_daum_roughmap a{cursor:default!important;text-decoration:none!important}</style><script>
/* Keep the supplied map and attribution visible without outbound navigation. */
addEventListener('DOMContentLoaded',()=>{
 const root=document.querySelector('.root_daum_roughmap');if(!root)return;
 function links(){for(const a of root.querySelectorAll('a')){
  if(a.hasAttribute('href'))a.removeAttribute('href');
  if(a.hasAttribute('target'))a.removeAttribute('target');
  if(a.tabIndex!==-1)a.tabIndex=-1;
 }}
 links();
 if('MutationObserver' in window)new MutationObserver(links).observe(root,{childList:true,subtree:true,attributes:true,attributeFilter:['href','target']});
 function stay(event){if(event.target instanceof Element&&event.target.closest('a')){event.preventDefault();event.stopImmediatePropagation();}}
 root.addEventListener('click',stay,true);root.addEventListener('auxclick',stay,true);
});
</script></head><body>
<!--
	* 카카오맵 - 약도서비스
	* 한 페이지 내에 약도를 2개 이상 넣을 경우에는
	* 약도의 수 만큼 소스를 새로 생성, 삽입해야 합니다.
-->
<!-- 1. 약도 노드 -->
<div id="daumRoughmapContainer1791973867374" class="root_daum_roughmap root_daum_roughmap_landing"></div>

<!-- 2. 설치 스크립트 -->
<script charset="UTF-8" class="daum_roughmap_loader_script" src="https://t1.kakaocdn.net/kakaomapweb/roughmap/loader/prod/roughmapLoader.js"></script>

<!-- 3. 실행 스크립트 -->
<script charset="UTF-8">
	new daum.roughmap.Lander({
		"timestamp" : "1791973867374",
		"key" : "39tehsz8efd",
		"mapWidth" : "640",
		"mapHeight" : "360"
	}).render();
</script>
</body></html>
