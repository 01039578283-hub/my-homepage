<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="robots" content="noindex"><title>Local responsive review</title><style>body{margin:0;background:#dedfdc;font:14px sans-serif}nav{position:sticky;top:0;z-index:2;background:white;padding:10px;display:flex;gap:8px;flex-wrap:wrap}button,select{padding:8px}iframe{border:0;display:block;margin:12px auto;background:white;max-width:none}main{overflow:auto}output{display:block;background:#1a2440;color:white;padding:8px;font-size:12px}</style><nav aria-label="미리보기 설정"><button type="button" data-width="320">320px</button><button type="button" data-width="390">390px</button><button type="button" data-width="768">768px</button><button type="button" data-width="1440">1440px</button><select aria-label="페이지 선택"><option value="/#class-comparison">메인 비교표</option><option value="/#learning-process">메인 학습 과정</option><option value="/overview/수업형식-비교/">수업형식 비교</option><option value="/overview/학교별-내신관리/">학교별 내신관리</option><option value="/overview/플래너-학습관리/">플래너 학습관리</option><option value="/guide/#guide-academy-learning">학습가이드</option></select></nav><output aria-label="화면 검사 결과"></output><main><iframe title="반응형 페이지 미리보기" src="/#class-comparison" width="390" height="1700"></iframe></main><script>const frame=document.querySelector('iframe');function measure(){const d=frame.contentDocument,w=frame.contentWindow;if(!d?.querySelector('.wb-section'))return;const over=Array.from(d.querySelectorAll('.wb-section :is(table,img,.wb-card,.wb-link)')).filter(e=>e.getBoundingClientRect().right>d.documentElement.clientWidth+1||e.getBoundingClientRect().left<0).map(e=>e.tagName+'.'+e.className);document.querySelector('output').textContent=JSON.stringify({width:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,overflow:over,title:d.title,tables:d.querySelectorAll('.wb-table').length});}frame.addEventListener('load',()=>{measure();setTimeout(()=>{const h=new URL(frame.src,location.href).hash;if(h)frame.contentDocument.querySelector(h)?.scrollIntoView();window.scrollTo(0,0);measure()},500)});document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{frame.width=b.dataset.width;setTimeout(measure,120)}));document.querySelector('select').addEventListener('change',e=>frame.src=e.target.value);setInterval(measure,1000);</script></html>
